name: Deploy import editor

# 把 tools/import-editor 原样发布到 GitHub Pages：
# https://kongvalley.github.io/bioclock-app/
#
# 仓库 Settings → Pages → Source 需要选 "GitHub Actions"。
# 工具里的 src/meta.json / src/meta.js 已经在本地由 npm run import-editor 生成并提交，
# CI 不再重复生成（避免时间戳/换行符导致 diff）。

on:
  push:
    branches: [main]
    paths:
      - 'tools/import-editor/**'
      - '.github/workflows/import-editor.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: import-editor-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/import-editor

      - id: deployment
        uses: actions/deploy-pages@v4
