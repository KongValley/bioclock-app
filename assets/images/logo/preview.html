<!doctype html>
<meta charset="utf-8">
<title>BioClock logo</title>
<style>
  body { margin: 0; padding: 32px; background: #9aa0a6; font: 13px system-ui, sans-serif; color: #1f2933; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 32px; }
  .item { text-align: center; }
  .sq { border-radius: 22.5%; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .sq img { display: block; }
  .round { border-radius: 50%; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .round img { display: block; }
  .dark { background: #2b2f33; padding: 28px; border-radius: 16px; display: flex; gap: 28px; align-items: center; }
</style>
<div class="row">
  <div class="item"><div class="sq"><img src="icon.svg" width="384"></div><div>主图标</div></div>
  <div class="item"><div class="sq"><img src="icon.svg" width="180"></div><div>180</div></div>
  <div class="item"><div class="sq"><img src="icon.svg" width="120"></div><div>120</div></div>
  <div class="item"><div class="sq"><img src="icon.svg" width="60"></div><div>60</div></div>
  <div class="item"><div class="round"><img src="icon.svg" width="180"></div><div>圆形遮罩</div></div>
  <div class="item"><div class="round"><img src="android.svg" width="180"></div><div>Android 自适应<br>（圆形）</div></div>
  <div class="item"><div class="sq" style="background:#9aa0a6"><img src="foreground.svg" width="120"></div><div>Android 前景层</div></div>
  <div class="item"><div class="sq" style="background:#ffffff"><img src="monochrome.svg" width="96"></div><div>单色层</div></div>
  <div class="item"><div class="sq"><img src="splash-icon.svg" width="120"></div><div>启动图</div></div>
</div>
<div class="dark">
  <div class="item"><div class="round"><img src="icon.svg" width="48"></div><div style="color:#e5e7eb">深色 48</div></div>
  <div class="item"><div class="sq"><img src="icon.svg" width="48"></div><div style="color:#e5e7eb">方形 48</div></div>
</div>
