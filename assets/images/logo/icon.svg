<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4B8"/>
      <stop offset="1" stop-color="#2A8A82"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F6F4"/>
    </linearGradient>
  </defs>

  <!-- 青绿渐变圆角底 -->
  <rect width="120" height="120" rx="38" fill="url(#bg)"/>
  <circle cx="92" cy="26" r="14" fill="#FFFFFF" fill-opacity="0.18"/>
  <circle cx="24" cy="100" r="10" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- 水滴 + 对勾 -->
  <path d="M60 17 C60 17 30 51 30 71 A30 30 0 0 0 90 71 C90 51 60 17 60 17 Z" fill="url(#drop)"/>
  <ellipse cx="50" cy="61" rx="5" ry="9" fill="#FFFFFF" fill-opacity="0.7" transform="rotate(20 50 61)"/>
  <polyline points="47,71 56,80 74,61" fill="none" stroke="#2A8A82" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
